<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ANSA - Home</title>

<style>
  html,body{
    height:100%;
    margin:0;
    font-family:"Poppins",sans-serif;
    background:#001f3f;
    color:#fff;
    opacity:0;
    animation: fadeIn 1.5s ease-in forwards;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(15px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* HEADER */
  header nav{
    background:rgba(0,31,63,0.95);
    padding:14px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:10;
  }

  .logo{
    font-size:2rem;
    font-weight:900;
    color:#00bfff;
    letter-spacing:2px;
    text-shadow:0 0 10px #00bfff, 0 0 20px #00bfff;
    animation: glowPulse 2.5s infinite ease-in-out;
  }

  @keyframes glowPulse {
    0% { text-shadow: 0 0 8px #00bfff; }
    50% { text-shadow: 0 0 18px #66ffff; }
    100% { text-shadow: 0 0 8px #00bfff; }
  }

  .menu{
    display:flex;
    gap:25px;
  }

  .menu a{
    color:#fff;
    text-decoration:none;
    font-weight:500;
    transition:0.3s;
  }

  .menu a:hover{
    color:#00bfff;
  }

  /* HERO SECTION – add your own image */
  .hero{
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    /* ⭐⭐ CHANGE ONLY THIS ⭐⭐ */
    background-image:url('bg.jpg.jpeg');  /* <-- Replace with your real image file */
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }

  footer{
    text-align:center;
    padding:18px;
    background:rgba(0,31,63,0.9);
    color:#ddd;
  }
</style>
</head>

<body>

<header>
  <nav>
    <div class="logo">ANSA</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="careers.html">Careers</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<!-- Background image only -->
<main class="hero"></main>

<footer>
  <small>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</small>
</footer>

</body>
</html>
