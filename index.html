<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ANSA - Home</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{
    height:100%;
    margin:0;
    font-family:"Poppins",sans-serif;
    background:#001f3f;
    color:#fff;
    opacity:0;
    animation: fadeIn 1.5s ease-in forwards;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(15px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* Header */
  header nav{
    background:rgba(0,31,63,0.95);
    padding:14px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:10;
  }

  /* Animated glowing ANSA logo */
  .logo{
    font-size:2rem;
    font-weight:900;
    color:#00bfff;
    letter-spacing:2px;
    text-shadow:0 0 10px #00bfff, 0 0 20px #00bfff, 0 0 30px #00bfff;
    animation: glowPulse 2.5s infinite ease-in-out;
  }

  @keyframes glowPulse {
    0% { text-shadow: 0 0 8px #00bfff, 0 0 16px #00bfff; color:#00bfff; }
    50% { text-shadow: 0 0 18px #66ffff, 0 0 36px #00ffff; color:#66ffff; }
    100% { text-shadow: 0 0 8px #00bfff, 0 0 16px #00bfff; color:#00bfff; }
  }

  .menu{
    display:flex;
    gap:25px;
  }

  .menu a{
    color:#fff;
    text-decoration:none;
    font-weight:500;
    transition:0.3s;
  }

  .menu a:hover{
    color:#00bfff;
  }

  /* Hero section */
  .hero{
    background:url('bg.jpg.jpeg') no-repeat center center/cover;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    padding:0 20px;
  }

  /* Fire glow animation */
  @keyframes fireGlow {
    0% { box-shadow: 0 0 10px #ff4500, 0 0 20px #ff8c00, 0 0 40px #ffa500; }
    50% { box-shadow: 0 0 25px #ff6347, 0 0 50px #ffae42, 0 0 75px #ffd700; }
    100% { box-shadow: 0 0 15px #ff4500, 0 0 30px #ff8c00, 0 0 50px #ffa500; }
  }

  /* Fire box */
  .fire-box{
    background:rgba(255,140,0,0.1);
    border:2px solid #ffae42;
    border-radius:15px;
    padding:40px 60px;
    text-align:center;
    animation:fireGlow 2s infinite alternate ease-in-out;
    box-shadow:0 0 30px #ff8c00, 0 0 60px #ffa500;
    max-width:800px;
  }

  .fire-box h2{
    font-size:3rem;
    margin:0;
    color:#ffae42;
    text-shadow:0 0 10px #ffae42,0 0 25px #ffd700;
  }

  .fire-box p{
    margin-top:20px;
    line-height:1.6;
    font-size:1.1rem;
    color:#f5f5f5;
  }

  /* Footer */
  footer{
    text-align:center;
    padding:18px;
    background:rgba(0,31,63,0.9);
    color:#ddd;
  }

  @media(max-width:720px){
    .fire-box{padding:25px;}
    .fire-box h2{font-size:2.2rem;}
    .fire-box p{font-size:1rem;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo">ANSA</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="careers.html">Careers</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<main class="hero">
  
</main>

<footer>
  <small>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</small>
</footer>

</body>
</html>
