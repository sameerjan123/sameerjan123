<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Now - ANSA Careers</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: #001f3f;
  color: #fff;
  opacity: 0;
  animation: fadeIn 1.5s ease-in forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Form box */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.apply-box {
  background: rgba(0,0,0,0.4);
  padding: 40px;
  border-radius: 15px;
  width: 90%;
  max-width: 600px;
  animation: fireGlow 2s infinite alternate ease-in-out;
  box-shadow: 0 0 20px #ff4500, 0 0 40px #ff8c00, 0 0 60px #ffa500;
}
@keyframes fireGlow {
  0% { box-shadow: 0 0 10px #ff4500, 0 0 20px #ff8c00, 0 0 40px #ffa500; }
  50% { box-shadow: 0 0 25px #ff6347, 0 0 50px #ffae42, 0 0 75px #ffd700; }
  100% { box-shadow: 0 0 15px #ff4500, 0 0 30px #ff8c00, 0 0 50px #ffa500; }
}
.apply-box h2 {
  text-align: center;
  color: #ffae42;
  text-shadow: 0 0 8px #ffae42, 0 0 15px #ffd700;
}
form {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 20px;
}
input, textarea, select {
  background: rgba(255,255,255,0.1);
  border: 1px solid #ffae42;
  padding: 12px;
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
}
input::placeholder, textarea::placeholder { color: #ccc; }
textarea { resize: none; height: 100px; }
button {
  background: #ffae42;
  border: none;
  padding: 12px;
  border-radius: 25px;
  color: #fff;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #ff8c00;
  box-shadow: 0 0 10px #ffae42, 0 0 20px #ff8c00;
}

/* Footer */
footer {
  text-align: center;
  padding: 20px;
  background: rgba(0,31,63,0.9);
  color: #ccc;
  font-size: .9rem;
}
</style>
</head>
<body>

<div class="container">
  <div class="apply-box">
    <h2>Apply Now</h2>
    <form id="applyForm" onsubmit="handleSubmit(event)">
      <input type="text" id="jobTitle" name="jobTitle" placeholder="Position Applying For" required>
      <input type="text" name="name" placeholder="Your Full Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="text" name="address" placeholder="Your Address" required>
      <input type="file" name="resume" accept=".pdf,.doc,.docx" required>
      <button type="submit">Submit Application</button>
    </form>
  </div>
</div>

<footer>
  <p>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</p>
</footer>

<script>
function handleSubmit(e){
  e.preventDefault();
  window.location.href = "jobthankyou.html";
}
const params = new URLSearchParams(window.location.search);
const job = params.get("job");
if(job){
  document.getElementById("jobTitle").value = job;
}
</script>
</body>
</html>
