<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - ANSA</title>
<style>
html,body{
  height:100%;
  margin:0;
  font-family:"Poppins",sans-serif;
  background:#001f3f;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  animation:fadeIn 1.5s ease-in forwards;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(15px);}
  to{opacity:1;transform:translateY(0);}
}

/* Checkmark */
.checkmark{
  width:100px;
  height:100px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  border:4px solid #00bfff;
  position:relative;
  animation:glowPulse 2s infinite ease-in-out;
  box-shadow:0 0 20px #00bfff;
}
.checkmark::after{
  content:"";
  position:absolute;
  width:30px;
  height:60px;
  border-right:5px solid #00bfff;
  border-bottom:5px solid #00bfff;
  transform:rotate(45deg) translate(-5px,-10px);
  opacity:0;
  animation:tick 0.8s ease forwards 0.6s;
}
@keyframes tick{to{opacity:1;}}
@keyframes glowPulse{
  0%{box-shadow:0 0 10px #00bfff;}
  50%{box-shadow:0 0 25px #00ffff;}
  100%{box-shadow:0 0 10px #00bfff;}
}

/* Text */
h1{
  font-size:3rem;
  color:#00bfff;
  margin-top:25px;
  text-shadow:0 0 10px #00bfff,0 0 20px #00bfff;
  animation:glowPulse 2s infinite ease-in-out;
}
p{
  font-size:1.3rem;
  max-width:600px;
  margin-top:10px;
  color:#ddd;
  line-height:1.6;
}

/* Button */
a{
  margin-top:30px;
  display:inline-block;
  background:#00bfff;
  color:#fff;
  text-decoration:none;
  padding:12px 30px;
  border-radius:25px;
  font-size:1rem;
  transition:0.3s;
}
a:hover{
  background:#0099cc;
  transform:translateY(-3px);
}

/* Footer */
footer{
  position:fixed;
  bottom:0;
  width:100%;
  text-align:center;
  padding:15px 0;
  background:rgba(0,31,63,0.9);
  color:#ccc;
  font-size:.9rem;
}
</style>
</head>
<body>

<div class="checkmark"></div>
<h1>Thank You!</h1>
<p>Your message has been successfully sent.<br>We truly appreciate you reaching out to us — our team will get back to you soon.</p>
<a href="index.html">Return to Home</a>

<footer>
  <p>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</p>
</footer>

</body>
</html>
