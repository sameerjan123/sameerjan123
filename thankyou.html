<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - ANSA</title>
<style>
html,body{
  margin:0;
  height:100%;
  font-family:"Poppins",sans-serif;
  background:#001f3f;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  animation:fadeIn 1.5s ease-in forwards;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
.thankyou-box{
  background:rgba(0,191,255,0.1);
  padding:40px 60px;
  border-radius:15px;
  box-shadow:0 0 20px #00bfff,0 0 40px #00bfff;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 15px #00bfff;}
  to{box-shadow:0 0 30px #00ffff;}
}
.thankyou-box h2{
  color:#00bfff;
  font-size:2rem;
  margin-bottom:10px;
}
.thankyou-box p{
  color:#ddd;
  font-size:1.1rem;
  margin-bottom:25px;
}
.thankyou-box a{
  color:#fff;
  background:#00bfff;
  padding:10px 20px;
  border-radius:8px;
  text-decoration:none;
  transition:0.3s;
}
.thankyou-box a:hover{background:#0099cc;}
</style>
</head>
<body>
  <div class="thankyou-box">
    <h2>🔥 Thank You for Contacting Us!</h2>
    <p>We’ve received your message and will get back to you soon.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
