<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - ANSA</title>
<style>
html,body{
  height:100%;
  margin:0;
  font-family:"Poppins",sans-serif;
  background:#001f3f;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  animation:fadeIn 1.5s ease-in forwards;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(15px);}
  to{opacity:1;transform:translateY(0);}
}

/* Fire-glow animation */
@keyframes fireGlow {
  0% { box-shadow: 0 0 10px #ff4500, 0 0 20px #ff8c00, 0 0 40px #ffa500; }
  50% { box-shadow: 0 0 25px #ff6347, 0 0 50px #ffae42, 0 0 75px #ffd700; }
  100% { box-shadow: 0 0 15px #ff4500, 0 0 30px #ff8c00, 0 0 50px #ffa500; }
}

/* Fire box container */
.fire-box{
  background:rgba(255,140,0,0.1);
  border:2px solid #ffae42;
  border-radius:15px;
  padding:40px 60px;
  text-align:center;
  animation:fireGlow 2s infinite alternate ease-in-out;
  box-shadow:0 0 30px #ff8c00, 0 0 60px #ffa500;
}

/* Checkmark */
.checkmark{
  width:80px;
  height:80px;
  border-radius:50%;
  border:4px solid #ffae42;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  margin:0 auto;
  animation:fireGlow 2s infinite alternate ease-in-out;
}
.checkmark::after{
  content:"";
  position:absolute;
  width:25px;
  height:45px;
  border-right:4px solid #ffae42;
  border-bottom:4px solid #ffae42;
  transform:rotate(45deg) translate(-4px,-6px);
  opacity:0;
  animation:tick 0.8s ease forwards 0.6s;
}
@keyframes tick{to{opacity:1;}}

/* Text */
h1{
  font-size:2rem;
  color:#ffae42;
  margin-top:20px;
  text-shadow:0 0 10px #ffae42,0 0 25px #ffd700;
}
p{
  font-size:1.1rem;
  max-width:500px;
  margin-top:10px;
  color:#ddd;
  line-height:1.5;
}

/* Button */
a{
  margin-top:25px;
  display:inline-block;
  background:#ffae42;
  color:#fff;
  text-decoration:none;
  padding:10px 25px;
  border-radius:25px;
  font-size:1rem;
  transition:0.3s;
  animation:fireGlow 2s infinite alternate ease-in-out;
}
a:hover{
  background:#ff8c00;
  transform:translateY(-3px);
}

/* Footer */
footer{
  position:fixed;
  bottom:0;
  width:100%;
  text-align:center;
  padding:15px 0;
  background:rgba(0,31,63,0.9);
  color:#ccc;
  font-size:.9rem;
}
</style>
</head>
<body>

<div class="fire-box">
  <div class="checkmark"></div>
  <h1>Thank You!</h1>
  <p>Your message has been successfully sent.<br>We truly appreciate you reaching out to us — our team will get back to you soon.</p>
  <a href="index.html">Return to Home</a>
</div>

<footer>
  <p>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</p>
</footer>

</body>
</html>
