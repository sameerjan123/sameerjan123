<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ANSA - Contact</title>
<link rel="stylesheet" href="style.css">
<style>
/* kept consistent header/footer sizing so it matches other pages */
html,body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background:#001f3f;
  color:#fff;
  opacity:0;
  animation:fadeIn 1.2s ease-in forwards;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Header (same size/spacing as your other pages) */
header nav{
  background:rgba(0,31,63,0.95);
  padding:14px 40px;               /* preserved */
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:10;
}
.logo{
  font-size:2rem;                 /* same as other pages */
  font-weight:900;
  color:#00bfff;
  letter-spacing:2px;
  text-shadow:0 0 10px #00bfff,0 0 20px #00bfff,0 0 30px #00bfff;
  animation:glowPulse 2.5s infinite ease-in-out;
}
@keyframes glowPulse{
  0%{text-shadow:0 0 8px #00bfff,0 0 16px #00bfff;}
  50%{text-shadow:0 0 18px #66ffff,0 0 36px #00ffff;}
  100%{text-shadow:0 0 8px #00bfff,0 0 16px #00bfff;}
}
.menu{display:flex;gap:25px;}
.menu a{color:#fff;text-decoration:none;font-weight:500;transition:.25s;}
.menu a:hover{color:#00bfff;}

/* Hero */
.hero{
  background:url('https://media.istockphoto.com/id/1450058572/photo/businessman-using-a-laptop-and-touching-on-virtual-screen-contact-icons-consists-of-telephone.jpg?s=612x612&w=0&k=20&c=R5wzCGHu6ZS-8EQpJ2Z1tkSbKGGdJH4apVhFM18EXSM=') no-repeat center center/cover;
  height:60vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.hero h2{font-size:3rem;margin:0;color:#fff;text-shadow:0 0 10px #00bfff,0 0 25px #00ffff;}

/* Contact cards */
.contact-cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin:40px 0;
}
.contact-card{
  background:rgba(0,191,255,0.1);
  border-radius:15px;
  padding:25px;
  width:280px;
  text-align:center;
  transition:0.25s;
  box-shadow:0 0 12px rgba(0,191,255,0.08);
}
.contact-card:hover{background:rgba(0,191,255,0.18);transform:translateY(-6px)}
.contact-card h3{color:#00bfff;margin:0 0 8px}

/* Contact form - fire look preserved, but pointer-events fix applied */
form.contact-form{
  max-width:600px;
  margin:0 auto 50px auto;
  text-align:left;
  background:rgba(0,31,63,0.7);
  padding:28px;
  border-radius:16px;
  position:relative;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  overflow:visible; /* keep visual glow but allow clicks */
}

/* rotating glow layer (visual) — pointer-events disabled so inputs remain clickable */
form.contact-form::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:radial-gradient(circle at 30% 20%, rgba(0,191,255,0.07), transparent 25%),
             radial-gradient(circle at 70% 80%, rgba(0,255,255,0.05), transparent 20%);
  transform:rotate(0deg);
  animation:spinGlow 12s linear infinite;
  pointer-events: none; /* IMPORTANT: allow clicks through the glow layer */
  z-index:0;
}
@keyframes spinGlow{ to { transform: rotate(360deg); } }

form.contact-form > * { position:relative; z-index:1; } /* ensure inputs above glow */

/* form header */
form.contact-form h3{
  text-align:center;
  color:#00bfff;
  font-size:1.6rem;
  margin:0 0 18px;
  text-shadow:0 0 8px rgba(0,191,255,0.2);
}

/* inputs */
form.contact-form input,
form.contact-form textarea{
  width:100%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:8px;
  border:2px solid rgba(0,191,255,0.14);
  background:rgba(0,0,0,0.35);
  color:#fff;
  font-size:1rem;
  outline:none;
  transition:box-shadow .18s, border-color .18s, transform .12s;
}
form.contact-form input::placeholder,
form.contact-form textarea::placeholder{ color: #cfeff8; }

form.contact-form input:focus,
form.contact-form textarea:focus{
  border-color: rgba(0,255,255,0.45);
  box-shadow:0 6px 18px rgba(0,191,255,0.12);
  transform: translateY(-1px);
}

/* button (neon gradient) */
form.contact-form button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:10px;
  border:none;
  font-weight:700;
  font-size:1rem;
  cursor:pointer;
  background: linear-gradient(90deg,#00bfff,#00ffff);
  color:#002033;
  box-shadow:0 8px 30px rgba(0,191,255,0.18);
  transition: transform .15s, box-shadow .15s;
}
form.contact-form button:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 40px rgba(0,191,255,0.28);
}

/* footer */
footer{
  text-align:center;
  padding:18px;
  background:rgba(0,31,63,0.9);
  color:#ddd;
}

/* responsive tweaks */
@media(max-width:700px){
  header nav{padding:12px 20px}
  .logo{font-size:1.6rem}
  .hero{height:45vh}
  form.contact-form{padding:20px}
}
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo">ANSA</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="careers.html">Careers</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<section class="hero">
  <h2>Contact ANSA</h2>
</section>

<section>
  <div class="contact-cards">
    <div class="contact-card">
      <h3>Office Location</h3>
      <p>ACHENAMBAL, ZAFFRON COLONY, PANTHACHOWK, SRINAGAR, J&K, INDIA</p>
    </div>
    <div class="contact-card">
      <h3>Call Us</h3>
      <p>+91 7006365752</p>
    </div>
    <div class="contact-card">
      <h3>Email Us</h3>
      <p>info@ansasolutions.com<br>careers@ansasolutions.com</p>
    </div>
  </div>

  <form class="contact-form" id="contactForm">
    <h3>Send Us a Message</h3>

    <input type="text" name="Name" placeholder="Your Name" required>
    <input type="email" name="Email" placeholder="Your Email" required>
    <textarea name="Message" placeholder="Your Message" rows="5" required></textarea>

    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
  <p>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</p>
</footer>

<script>
// keep same behavior as before: client-side redirect to thankyou page after submit
document.getElementById("contactForm").addEventListener("submit", function(e){
  e.preventDefault();
  // you can replace this with form submit to backend later; for now just redirect:
  window.location.href = "thankyou.html";
});
</script>

</body>
</html>
