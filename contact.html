<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANSA - Contact</title>
<link rel="stylesheet" href="style.css">
<style>
/* Hero section for Contact page */
.hero {
  background: url('https://media.istockphoto.com/id/1450058572/photo/businessman-using-a-laptop-and-touching-on-virtual-screen-contact-icons-consists-of-telephone.jpg?s=612x612&w=0&k=20&c=R5wzCGHu6ZS-8EQpJ2Z1tkSbKGGdJH4apVhFM18EXSM=') no-repeat center center/cover;
  height: 60vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #fff;
}

.hero h2 {
  font-size: 3rem;
  font-weight: 700;
  margin: 0;
}

.hero p {
  font-size: 1.3rem;
  max-width: 800px;
  margin-top: 15px;
  line-height: 1.5;
}

/* Contact Cards */
.contact-cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin: 40px 0;
}

.contact-card {
  background: rgba(0,191,255,0.1);
  border-radius: 15px;
  padding: 25px;
  width: 280px;
  text-align: center;
  transition: 0.3s;
}

.contact-card:hover {
  background: rgba(0,191,255,0.2);
}

.contact-card h3 {
  color: #00bfff;
  margin-bottom: 10px;
}

.contact-card p {
  color: #ddd;
  line-height: 1.5;
}

/* Contact Form */
form.contact-form {
  max-width: 600px;
  margin: 0 auto 50px auto;
  text-align: left;
  background: rgba(0,31,63,0.6);
  padding: 25px;
  border-radius: 15px;
}

form.contact-form input,
form.contact-form textarea {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border-radius: 5px;
  border: none;
  font-size: 1rem;
}

form.contact-form textarea {
  height: 120px;
  resize: none;
}

form.contact-form button {
  width: 100%;
  background: #00bfff;
  border: none;
  padding: 12px;
  border-radius: 5px;
  font-size: 1rem;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

form.contact-form button:hover {
  background: #0099cc;
}
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="careers.html">Careers</a>
    <a href="contact.html" class="right">Contact</a>
  </nav>
</header>
<section class="hero">
  <h2>Contact ANSA</h2>
  
</section>

<section id="contact">
  <div class="contact-cards">
    <div class="contact-card">
      <h3>Office Location</h3>
      <p>ACHENAMBAL, ZAFFRON COLONY, PANTHACHOWK, SRINAGAR, JAMMU AND KASHMIR, INDIA</p>
    </div>
    <div class="contact-card">
      <h3>Call Us</h3>
      <p>+91 7006365752</p>
    </div>
    <div class="contact-card">
      <h3>Email Us</h3>
      <p>info@ansasolutions.com<br>careers@ansasolutions.com</p>
    </div>
  </div>

  <form class="contact-form" action="https://formsubmit.co/sameerjan1246@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="New Contact Message from Ansa Website">
    <input type="hidden" name="_captcha" value="false">
    <input type="text" name="Name" placeholder="Your Name" required>
    <input type="email" name="Email" placeholder="Your Email" required>
    <textarea name="Message" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
<p>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</p>
</footer>

</body>
</html>
