<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANSA - Contact</title>
<style>
html,body{margin:0;font-family:"Poppins",sans-serif;background:#001f3f;color:#fff;}
@keyframes fireGlow{0%{box-shadow:0 0 10px #ff4500,0 0 20px #ff8c00,0 0 40px #ffa500;}
50%{box-shadow:0 0 25px #ff6347,0 0 50px #ffae42,0 0 75px #ffd700;}
100%{box-shadow:0 0 15px #ff4500,0 0 30px #ff8c00,0 0 50px #ffa500;}}
header nav{background:rgba(0,31,63,0.95);padding:14px 40px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:2rem;font-weight:900;color:#00bfff;text-shadow:0 0 10px #00bfff,0 0 20px #00bfff;}
.menu{display:flex;gap:25px;}
.menu a{color:#fff;text-decoration:none;font-weight:500;transition:.25s;}
.menu a:hover{color:#00bfff;}
.hero{background:url('https://media.istockphoto.com/id/1450058572/photo/businessman-using-a-laptop-and-touching-on-virtual-screen-contact-icons-consists-of-telephone.jpg?s=612x612&w=0&k=20&c=R5wzCGHu6ZS-8EQpJ2Z1tkSbKGGdJH4apVhFM18EXSM=') no-repeat center/cover;height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.hero h2{font-size:3rem;margin:0;color:#fff;text-shadow:0 0 10px #00bfff,0 0 25px #00ffff;}
.contact-section{display:flex;flex-direction:column;align-items:center;gap:30px;margin:50px 0;}
.contact-box{background:rgba(0,0,0,0.4);padding:25px;border-radius:15px;width:80%;max-width:700px;text-align:center;animation:fireGlow 2s infinite alternate ease-in-out;}
.contact-box h3{color:#ffae42;text-shadow:0 0 8px #ffae42,0 0 15px #ffd700;}
.contact-box form input,.contact-box form textarea{width:100%;margin:10px 0;padding:12px 14px;border-radius:8px;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:1rem;outline:none;}
.contact-box form input::placeholder,.contact-box form textarea::placeholder{color:#ddd;}
.contact-box form button{background:#ffae42;border:none;padding:10px 20px;border-radius:25px;color:#fff;font-size:1rem;margin-top:10px;cursor:pointer;transition:0.3s;}
.contact-box form button:hover{background:#ff8c00;}
footer{text-align:center;padding:20px;background:rgba(0,31,63,0.9);color:#ccc;font-size:.9rem;}
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo">ANSA</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="careers.html">Careers</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<section class="hero">
  <h2>Contact ANSA</h2>
</section>

<section class="contact-section">

  <div class="contact-box">
    <h3>Office Location</h3>
    <p><a href="https://maps.app.goo.gl/NF2q84dFun1WzZd19" target="_blank" style="color:#ffae42;text-decoration:none;">
    ACHENAMBAL, ZAFFRON COLONY, PANTHACHOWK, SRINAGAR, J&K, INDIA</a></p>
  </div>

  <div class="contact-box">
    <h3>Call Us</h3>
    <p><a href="tel:+917006365752" style="color:#ffae42;text-decoration:none;">+91 7006365752</a></p>
  </div>

  <div class="contact-box">
    <h3>Email Us</h3>
    <p>
      <button type="button" onclick="sendEmail('info@ansasolutions.com')" style="background:none;border:none;color:#ffae42;font-size:1.1rem;cursor:pointer;">info@ansasolutions.com</button><br>
      <button type="button" onclick="sendEmail('careers@ansasolutions.com')" style="background:none;border:none;color:#ffae42;font-size:1.1rem;cursor:pointer;">careers@ansasolutions.com</button>
    </p>
  </div>

  <div class="contact-box">
    <h3>Send Us a Message</h3>
    <form id="contactForm" action="https://formspree.io/f/mnnoprbj" method="POST">
      <input type="text" name="name" placeholder="Your Full Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

</section>

<footer>
  <p>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</p>
</footer>

<script>
function sendEmail(type){
  fetch("https://formspree.io/f/mnnoprbj", {
    method: "POST",
    headers: { "Accept": "application/json" },
    body: JSON.stringify({
      emailType: type,
      message: "A visitor clicked on " + type
    })
  }).then(response=>{
    if(response.ok){ window.location.href="thankyou.html"; }
    else{ alert("Something went wrong. Try again."); }
  }).catch(()=>alert("Network error."));
}

document.getElementById("contactForm").addEventListener("submit", function(e){
  e.preventDefault();
  const form = e.target;
  fetch(form.action, {
    method: form.method,
    body: new FormData(form),
    headers: { 'Accept': 'application/json' }
  }).then(response => {
    if (response.ok) {
      window.location.href = "thankyou.html";
    } else {
      alert("Oops! Something went wrong. Please try again.");
    }
  }).catch(() => alert("Network error. Please try again."));
});
</script>

</body>
</html>
