<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANSA - Contact</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background:#001f3f;
  color:#fff;
  opacity:0;
  animation:fadeIn 1.5s ease-in forwards;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(15px);}
  to{opacity:1;transform:translateY(0);}
}

/* Header */
header nav{
  background:rgba(0,31,63,0.95);
  padding:14px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:10;
}
.logo{
  font-size:2rem;
  font-weight:900;
  color:#00bfff;
  letter-spacing:2px;
  text-shadow:0 0 10px #00bfff,0 0 20px #00bfff,0 0 30px #00bfff;
  animation:glowPulse 2.5s infinite ease-in-out;
}
@keyframes glowPulse{
  0%{text-shadow:0 0 8px #00bfff,0 0 16px #00bfff;}
  50%{text-shadow:0 0 18px #66ffff,0 0 36px #00ffff;}
  100%{text-shadow:0 0 8px #00bfff,0 0 16px #00bfff;}
}
.menu{
  display:flex;
  gap:25px;
}
.menu a{
  color:#fff;
  text-decoration:none;
  font-weight:500;
  transition:0.3s;
}
.menu a:hover{
  color:#00bfff;
}

/* Hero Section */
.hero{
  background:url('https://media.istockphoto.com/id/1450058572/photo/businessman-using-a-laptop-and-touching-on-virtual-screen-contact-icons-consists-of-telephone.jpg?s=612x612&w=0&k=20&c=R5wzCGHu6ZS-8EQpJ2Z1tkSbKGGdJH4apVhFM18EXSM=') no-repeat center center/cover;
  height:60vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.hero h2{
  font-size:3rem;
  margin:0;
  color:#fff;
  text-shadow:0 0 10px #00bfff,0 0 25px #00ffff;
}

/* Contact Section */
.contact-section{
  padding:50px 20px;
  text-align:center;
}
.contact-cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  margin-bottom:50px;
}
.contact-card{
  background:rgba(0,191,255,0.1);
  border-radius:15px;
  padding:25px;
  width:280px;
  text-align:center;
  transition:0.3s;
}
.contact-card:hover{
  background:rgba(0,191,255,0.2);
}
.contact-card h4{
  color:#00bfff;
  margin-bottom:10px;
}

/* Contact Form */
form.contact-form{
  max-width:600px;
  margin:0 auto;
  text-align:left;
  background:rgba(0,31,63,0.6);
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,191,255,0.2);
}
form.contact-form h3{
  text-align:center;
  color:#00bfff;
  font-size:2rem;
  margin-bottom:20px;
  text-shadow:0 0 10px #00bfff;
}
form.contact-form label{
  font-weight:500;
}
form.contact-form input,
form.contact-form textarea{
  width:100%;
  margin:10px 0;
  padding:10px;
  border-radius:5px;
  border:none;
  font-size:1rem;
}
form.contact-form input{
  background:#fff;
  color:#000;
}
form.contact-form textarea{
  background:#fff;
  color:#000;
  height:120px;
}
form.contact-form button{
  width:100%;
  background:#00bfff;
  border:none;
  padding:12px;
  border-radius:5px;
  font-size:1rem;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
}
form.contact-form button:hover{
  background:#0099cc;
  transform:scale(1.03);
}

footer{
  text-align:center;
  padding:18px;
  background:rgba(0,31,63,0.9);
  color:#ddd;
  margin-top:50px;
}
</style>
</head>
<body>
<header>
  <nav>
    <div class="logo">ANSA</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="careers.html">Careers</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<section class="hero">
  <h2>Contact ANSA</h2>
</section>

<section class="contact-section">
  <div class="contact-cards">
    <div class="contact-card">
      <h4>Office Location</h4>
      <p>ACHENAMBAL, ZAFFRON COLONY,<br>PANTHACHOWK, SRINAGAR, J&K, INDIA</p>
    </div>
    <div class="contact-card">
      <h4>Call Us</h4>
      <p>+91 7006365752</p>
    </div>
    <div class="contact-card">
      <h4>Email Us</h4>
      <p>info@ansasolutions.com<br>careers@ansasolutions.com</p>
    </div>
  </div>

  <!-- FORM BELOW CONTACT CARDS -->
  <form class="contact-form" action="https://formsubmit.co/sameerjan1246@gmail.com" method="POST">
    <h3>Send Us a Message</h3>
    <input type="hidden" name="_subject" value="New Contact Message from ANSA Website">
    <input type="hidden" name="_captcha" value="false">

    <!-- ✅ Correct GitHub redirect -->
    <input type="hidden" name="_next" value="https://sameerjan123.github.io/thankyou.html">

    <label for="name">Your Name</label>
    <input type="text" name="Name" id="name" placeholder="Enter your full name" required>

    <label for="email">Your Email</label>
    <input type="email" name="Email" id="email" placeholder="Enter your email address" required>

    <label for="message">Your Message</label>
    <textarea name="Message" id="message" placeholder="Write your message here..." required></textarea>

    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
  <p>&copy; 2025 ANSA SOFTWARE SOLUTIONS. All rights reserved.</p>
</footer>
</body>
</html>
